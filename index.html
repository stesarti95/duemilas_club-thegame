  else if (state === 'menu' && ['ArrowLeft', 'KeyA'].includes(e.code)) { sel = (sel + CHARS.length - 1) % CHARS.length; beep(600, .05); }
  else if (state === 'menu' && ['ArrowRight', 'KeyD'].includes(e.code)) { sel = (sel + 1) % CHARS.length; beep(600, .05); }
  else if (e.code === 'KeyP') togglePause();
  else if (e.code === 'Escape') { if (state === 'run') state = 'pause'; else if (state === 'pause' || state === 'dead') toMenu(); }
  else if (e.code === 'KeyM') setMuted(!muted);
  else if (e.code === 'KeyF') toggleFS();
});
addEventListener('keyup', e => {
  if (['ArrowDown', 'KeyS'].includes(e.code)) { keyDuck = false; syncHolds(); }
  if (JUMPK.includes(e.code)) { keyJump = false; syncHolds(); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'run') state = 'pause'; });
function hudAction(id) {
  if (id === 'pause') togglePause(); else if (id === 'sound') setMuted(!muted); else if (id === 'full') toggleFS();
}
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (e.pointerType === 'touch') isTouch = true;
  const r = cv.getBoundingClientRect(), p = { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
  for (const b of hudBtns()) if (inR(p, [b.x, b.y, b.w, b.h])) return hudAction(b.id);
  if (state === 'menu') {
    if (inR(p, MG.btn)) return startGame();
    for (let i = 0; i < CHARS.length; i++) if (inR(p, MG.cards[i])) { if (sel === i) return startGame(); sel = i; beep(600, .05); return; }
  } else if (state === 'dead') {
    const op = overlayPos();
    if (inR(p, op.menu)) return toMenu();
    if (performance.now() - deadAt > 350) startGame();
  } else if (state === 'pause') {
    const op = overlayPos();
    if (inR(p, op.menu)) return toMenu();
    if (inR(p, op.again)) state = 'run';
  } else {
    const zone = p.x < W / 2 ? 'jump' : 'duck';
    ptrs.set(e.pointerId, zone); try { cv.setPointerCapture(e.pointerId); } catch (er) {}
    syncHolds(); if (zone === 'jump') jump();
  }
});
const release = e => { ptrs.delete(e.pointerId); syncHolds(); };
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => cv.addEventListener(ev, release));
})();
</script>
