  "D5 . F5 . A5 . F5 . D5 . F5 . A5 . D6 .",
  "A#4 . D5 . F5 . D5 . A#4 . D5 . F5 . A#5 .",
  "C5 . E5 . G5 . E5 . C5 . E5 . G5 . C6 .",
  "A4 . C#5 . E5 . C#5 . A4 . E5 . A5 - - .",
  "D6 D6 . A5 . D6 . F6 A5 . A5 . F5 . D5 .",
  "A#5 A#5 . F5 . A#5 . D6 F5 . F5 . D5 . A#4 .",
  "C6 C6 . G5 . C6 . E6 G5 . G5 . E5 . C5 .",
  "C#6 . A5 . E5 . A5 . C#6 . E6 - - . A5 ."
];
const PANC = PANC_SRC.map(bar => {
  const tk = bar.split(' '); if (tk.length !== 16) throw new Error('battuta panc non da 16');
  return tk.map((t, i) => { if (t === '.' || t === '-') return null; let len = 1, j = i + 1; while (j < 16 && tk[j] === '-') { len++; j++; } if (j < 16 && tk[j] === '.') len += .6; return { m: midi(t), len }; });
});
const PANC_ROOTS = [50, 46, 48, 45], PANC_CHORDS = [[62, 65, 69], [58, 62, 65], [60, 64, 67], [57, 61, 64]];
function playPancStep(step, t, sd) {
  const bar = Math.floor(step / 16) % 8, s = step % 16, n = PANC[bar][s], root = PANC_ROOTS[bar % 4];
  if (n) tone(hz(n.m), t, n.len * sd * .9, 'square', .075);
  if (s === 0 || s === 3 || s === 6 || s === 8 || s === 11 || s === 14) tone(hz(root + (s === 3 || s === 11 ? 12 : s === 14 ? 7 : 0)), t, sd * 1.7, 'triangle', .2);
  if (s % 2 === 1) tone(hz(PANC_CHORDS[bar % 4][((s - 1) / 2) % 3]), t, sd * .8, 'square', .024);
  if (s === 0 || s === 6 || s === 8 || s === 12) kick(t);
  if (s === 4 || s === 12) noise(t, .09, .12, 1800);
  noise(t, .02, .03, 9000);
}

  "F5 . A5 . F5 . C5 . F5 . . . C5 . A4 .",
  "G5 . B5 . G5 . D5 . G5 . . . D5 . B4 .",
  "E5 . G5 . B5 . G5 . E5 - - . B4 . . .",
  "A5 . C6 . A5 . E5 . A5 . C6 . E6 . C6 .",
  "A5 . C6 . A5 . F5 . A5 . C6 . F6 . C6 .",
  "B5 . D6 . B5 . G5 . B5 . D6 . G6 . D6 .",
  "G5 . B5 . E6 - - . B5 . G5 . E5 . . ."
];
const TETM = TET_SRC.map(bar => {
  const tk = bar.split(' '); if (tk.length !== 16) throw new Error('battuta tetris non da 16');
  return tk.map((t, i) => { if (t === '.' || t === '-') return null; let len = 1, j = i + 1; while (j < 16 && tk[j] === '-') { len++; j++; } if (j < 16 && tk[j] === '.') len += .8; return { m: midi(t), len }; });
});
const TET_ROOTS = [45, 41, 43, 40], TET_CHORDS = [[57, 60, 64], [53, 57, 60], [55, 59, 62], [52, 55, 59]];
function playTetStep(step, t, sd) {

function musicStart() {
  if (mTimer || !ac()) return;
  try {
    mGain = actx.createGain(); mGain.gain.value = muted ? 0 : 1; mGain.connect(actx.destination);
    happyGain = actx.createGain(); happyGain.connect(mGain); sadGain = actx.createGain(); sadGain.gain.value = 0; sadGain.connect(mGain);
    noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    mNext = actx.currentTime + .08; mStep = 0;
    mTimer = setInterval(() => {
      if (state === 'pause' || document.hidden) { mNext = actx.currentTime + .08; return; }
      const now = actx.currentTime, wantSad = state === 'dead';
      if (wantSad !== sadMode) { // cambio di brano: allegro <-> triste
        sadMode = wantSad; mStep = 0; mNext = now + (wantSad ? .4 : .08);
        if (wantSad) { happyGain.gain.setTargetAtTime(0, now, .03); sadGain.gain.setTargetAtTime(1, now + .3, .08); }
        else { happyGain.gain.setTargetAtTime(1, now, .01); sadGain.gain.setTargetAtTime(0, now, .04); }
      }
      if (sadMode) {
        const sd = 60 / 64 / 4;
        while (mNext < now + .15) { playSadStep(mStep, mNext, sd); mNext += sd; mStep = (mStep + 1) % 64; }
      } else {
        const kind = (typeof mode !== 'undefined' && state !== 'menu' && (mode === 'panc' || mode === 'tetris')) ? mode : 'main';
        if (kind !== musicKind) { musicKind = kind; mStep = 0; mNext = now + .1; }
        if (kind === 'panc') {
          const bpm = (typeof pc !== 'undefined' && pc.fright > 0) ? 168 : 148, sd = 60 / bpm / 4;
          while (mNext < now + .15) { playPancStep(mStep, mNext, sd); mNext += sd; mStep = (mStep + 1) % 128; }
        } else if (kind === 'tetris') {
          const bpm = 118 + (typeof tet !== 'undefined' ? Math.min(40, (tet.level - 1) * 5) : 0), sd = 60 / bpm / 4;
          while (mNext < now + .15) { playTetStep(mStep, mNext, sd); mNext += sd; mStep = (mStep + 1) % 128; }
        } else {
          const bpm = state === 'run' ? 132 + Math.min(40, Math.max(0, speed - 6.5) * 4.5) : 132, sd = 60 / bpm / 4;
          while (mNext < now + .15) { playStep(mStep, mNext, sd); mNext += sd; mStep = (mStep + 1) % 128; }
        }
      }
    }, 25);
  } catch (e) {}
}
function musicLevel() { // abbassa quando muori, azzera se muto
  if (!mGain) return;
  const v = muted ? 0 : 1;

}

// gesti sul telefono: tocco = ruota, trascina = muovi, scorri giu' = scendi / cala
cv.addEventListener('pointermove', e => {

function loop(ts) {

// ---------- input: tasti, tocco (sinistra = salta, destra = abbassati) ----------
const inR = (p, r) => p.x >= r[0] && p.x <= r[0] + r[2] && p.y >= r[1] && p.y <= r[1] + r[3];

function action() {
  if ((mode === 'panc' || mode === 'tetris') && state === 'run') return;
